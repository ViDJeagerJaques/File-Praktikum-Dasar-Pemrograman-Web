<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Pajak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <table border="1" style="width:95%" align="center" cellspacing="0" cellpadding="10">
            <tr>
                <th colspan="2">8.10 MASTER PAJAK</th>
            </tr>
            <tr>
                <td colspan="2">Lengkapi data berikut. Field bertanda (*) wajib diisi.</td>
            </tr>
            <tr>
                <td>Kode Pajak (*)</td>
                <td><input type="text" name="kode_pajak" value="" required></td>
            </tr>
            <tr>
                <td>Nama Pajak (*)</td>
                <td><input type="text" name="nama_pajak" value="" required></td>
            </tr>
            <tr>
                <td>Persentase (%) (*)</td>
                <td><input type="number" name="persentase" value="" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required></td>
            </tr>
            <tr>
                <td>Berlaku Mulai</td>
                <td><input type="date" name="berlaku_mulai" value=""></td>
            </tr>
            <tr>
                <td>Status (*)</td>
                <td>
                    <select name="status">
                        <option>Aktif</option>
                        <option>Tidak Aktif</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" bgcolor="#05e2ff">
                    <button type="button" onclick="simpan()">[ SIMPAN ]</button>
                    <button type="reset">[ RESET ]</button>
                    <button type="button" onclick="kembali()">[ KEMBALI ]</button>
                </td>
            </tr>
        </table>
    </form>

    <script src="fnc.js"></script>
</body>
</html>
